# compose.yml.example — Projekti Docker Compose mall
#
# See fail näitab põhistruktuuri. Kopeeri see compose.yml-iks ja kohanda.
# Erinevad näidisprojektid näitavad konkreetseid stacke (Airflow+dbt, Streamlit jne).
#
# Käivitamine pärast kohandamist:
#   cp .env.example .env
#   docker compose up -d --build

x-superset-build: &superset-build
  context: .
  dockerfile: Dockerfile.superset

services:

  # --- Andmebaas ---
  # Kõigil projektidel on vaja andmebaasi. pgDuckDB toetab nii PostgreSQL-i kui DuckDB päringuid.
  db:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: ecdc-haigusseire-db
    command: ["postgres", "-c", "timezone=${TZ}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST}:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Ühekordne Superseti seadistus: andmebaasi migratsioonid ja admin-kasutaja.
  superset-init:
    build: *superset-build
    container_name: ecdc-haigusseire-supersetinit
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py
      - superset_home:/app/superset_home
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_URI: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SUPERSET_SECRET_KEY}
      TZ: ${TZ}
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    command:
      - /bin/sh
      - -c
      - "superset db upgrade && (superset fab create-admin --username $${ADMIN_USERNAME} --firstname Admin --lastname User --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} || true) && superset init"
    restart: "no"

  # Superseti veebirakendus, mida õppija brauseris kasutab.
  superset:
    build: *superset-build
    container_name: ecdc-haigusseire-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    ports:
      - "${SUPERSET_PORT_HOST}:8088"
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py
      - superset_home:/app/superset_home
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_URI: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SUPERSET_SECRET_KEY}
      TZ: ${TZ}
    command: ["/app/docker/entrypoints/run-server.sh"]

volumes:
  pgdata:
    name: ecdc-haigusseire-pgdata
  superset_home:
    name: ecdc-haigusseire-supersethome

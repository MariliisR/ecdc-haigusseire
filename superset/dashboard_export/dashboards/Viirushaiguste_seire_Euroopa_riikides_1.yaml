    id: MARKDOWN-2XOcUnZ6JgzTNrvitTAYB
    meta:
      code: "# Oluline!\n\nT\xF6\xF6laual kuvatavad andmed viirushaiguste leviku kohta\
        \ Euroopas on p\xE4rit Euroopa seires\xFCsteem (TESSy) andmekogumisest. K\xE4\
        esolevalt antud s\xFCsteem l\xF5petatakse ja asendatakse s\xFCsteemiga EpiPulse\
        \ Cases.\n\nSelle \xFClemineku ajal ei ole v\xF5imalik andmeid uuendada, kuid\
        \ avaldamine j\xE4tkub 22. juunil 2026.\n\nSeet\xF5ttu ei ole v\xF5imalik\
        \ t\xF6\xF6laual kuvada viimase n\xE4dala andmeid, tulemusi kuvatakse viimase\
        \ kuu l\xF5ikes.\n\n\n\n## Tulemuste t\xF5lgendamisel tasub silmas pidada,\
        \ et riigi suurus m\xF5jutab ka tehtud testide hulka."
